<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Chart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="login-container">
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        <div id="main-container" style="display: none;">
            <h1>Welcome, Dentist!</h1>
            <button id="logout-button">Logout</button>
            <div id="patients-container">
                <h2>Your Patients</h2>
                <ul id="patients-list"></ul>
                <form id="add-patient-form">
                    <input type="text" id="patient-name" placeholder="Patient Name" required>
                    <input type="date" id="patient-dob" required>
                    <button type="submit">Add Patient</button>
                </form>
            </div>
            <div id="charts-container" style="display: none;">
                <h2 id="patient-name-header"></h2>
                <ul id="charts-list"></ul>
                <form id="add-chart-form">
                    <textarea id="chart-data" placeholder="Chart Data" required></textarea>
                    <button type="submit">Add Chart</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
