services:
  - type: web
    name: dental-chart-app
    env: python
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "python database_setup.py"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dental-chart-db
          property: connectionString
databases:
  - name: dental-chart-db
    plan: free
