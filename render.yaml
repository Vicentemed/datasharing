services:
  - type: web
    name: dental-chart-app
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dental-chart-db
          property: connectionString
  - type: psql
    name: dental-chart-db
    plan: free
